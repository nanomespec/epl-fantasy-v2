<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EPL Fantasy Mini App</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'fpl-purple': '#37003c',
            'fpl-green': '#00ff85',
            'fpl-dark': '#02894e',
            'fpl-pink': '#e90052'
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans text-gray-900 min-h-screen pb-20 select-none">

  <!-- Header Banner -->
  <header class="bg-fpl-purple text-white p-3 shadow-md border-b-2 border-fpl-green sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 id="user-display-name" class="font-black text-sm tracking-wide text-fpl-green">FANTASY MANAGER</h1>
        <p class="text-[10px] text-gray-300 font-bold uppercase">Gameweek 1</p>
      </div>
      <div class="text-right">
        <span class="block text-[9px] text-gray-400 font-bold uppercase">Bank / Free Trans</span>
        <span id="header-bank-info" class="text-xs font-black text-fpl-green">£1.0m | 1 FT</span>
      </div>
    </div>
  </header>

  <!-- Main View Render Mount Point -->
  <main id="app-container" class="max-w-md mx-auto p-2"></main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-fpl-purple border-t border-fpl-green/30 shadow-2xl z-40">
    <div class="max-w-md mx-auto flex justify-around p-1.5">
      <button onclick="switchTab('pitch')" id="nav-pitch" class="nav-btn flex-1 py-1 flex flex-col items-center text-fpl-green">
        <span class="text-base">⚽</span>
        <span class="text-[9px] font-black uppercase tracking-wider">Pick Team</span>
      </button>
      <button onclick="switchTab('points')" id="nav-points" class="nav-btn flex-1 py-1 flex flex-col items-center text-gray-400">
        <span class="text-base">📊</span>
        <span class="text-[9px] font-black uppercase tracking-wider">Points</span>
      </button>
      <button onclick="switchTab('transfers')" id="nav-transfers" class="nav-btn flex-1 py-1 flex flex-col items-center text-gray-400">
        <span class="text-base">🔄</span>
        <span class="text-[9px] font-black uppercase tracking-wider">Transfers</span>
      </button>
      <button onclick="switchTab('leagues')" id="nav-leagues" class="nav-btn flex-1 py-1 flex flex-col items-center text-gray-400">
        <span class="text-base">🏆</span>
        <span class="text-[9px] font-black uppercase tracking-wider">Leagues</span>
      </button>
    </div>
  </nav>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
