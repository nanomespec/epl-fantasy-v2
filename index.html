<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EPL Fantasy Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none bg-[#17212b] text-white font-sans">

  <!-- APP HEADER -->
  <header class="bg-[#242f3d] px-4 py-3 flex justify-between items-center border-b border-gray-700 shadow-md">
    <div>
      <h1 class="text-sm font-bold text-gray-100 tracking-wide">Gulit FC</h1>
      <p class="text-[11px] text-blue-400 font-medium">Gameweek 1 • Deadline: Oct 9, 15:00</p>
    </div>
    <div class="text-right">
      <span class="text-[10px] uppercase text-gray-400 tracking-wider">Total Points</span>
      <p class="text-lg font-extrabold text-green-400 leading-none mt-0.5">0</p>
    </div>
  </header>

  <!-- PITCH CONTAINER -->
  <main class="flex-1 p-3 flex flex-col justify-between overflow-y-auto">
    <div id="pitch-container" class="flex-1 flex flex-col justify-around py-2"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
