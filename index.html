<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EFPL Fantasy</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header Bar -->
  <header class="app-header">
    <div class="user-profile">
      <span class="avatar">⚽</span>
      <div class="user-meta">
        <h3 id="manager-name">Manager</h3>
        <p id="team-name">Addis Stars</p>
      </div>
    </div>
    <div class="stats-banner">
      <div class="stat-box">
        <span class="stat-label">Bank</span>
        <span class="stat-value" id="bank-val">ETB 100.0M</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Total Pts</span>
        <span class="stat-value" id="points-val">0</span>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('pitch')">Pitch</button>
    <button class="tab-btn" onclick="switchTab('transfers')">Transfers</button>
    <button class="tab-btn" onclick="switchTab('leagues')">Leagues</button>
    <button class="tab-btn" onclick="switchTab('fixtures')">Fixtures</button>
  </nav>

  <!-- Main View Area -->
  <main class="content-container">

    <!-- View 1: Football Pitch -->
    <section id="tab-pitch" class="tab-content active">
      <div class="pitch-container">
        <div class="pitch-row" id="row-GKP"></div>
        <div class="pitch-row" id="row-DEF"></div>
        <div class="pitch-row" id="row-MID"></div>
        <div class="pitch-row" id="row-FWD"></div>
      </div>
      
      <!-- Bench Section -->
      <div class="bench-container">
        <h4>Substitutes</h4>
        <div class="bench-row" id="row-BENCH"></div>
      </div>
    </section>

    <!-- View 2: Transfer Market -->
    <section id="tab-transfers" class="tab-content">
      <div class="market-controls">
        <input type="text" id="player-search" placeholder="Search player or club..." oninput="filterMarket()">
        <select id="pos-filter" onchange="filterMarket()">
          <option value="ALL">All Positions</option>
          <option value="GKP">Goalkeepers</option>
          <option value="DEF">Defenders</option>
          <option value="MID">Midfielders</option>
          <option value="FWD">Forwards</option>
        </select>
      </div>
      <div class="market-list" id="market-list"></div>
    </section>

    <!-- View 3: Leagues -->
    <section id="tab-leagues" class="tab-content">
      <div class="league-card">
        <h3>Ethiopian Premier League Global</h3>
        <p class="subtext">Overall Standings</p>
        <table class="league-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Manager</th>
              <th>Pts</th>
            </tr>
          </thead>
          <tbody id="league-rows">
            <tr><td>1</td><td>Abebe B.</td><td>142</td></tr>
            <tr><td>2</td><td>Nate (You)</td><td>128</td></tr>
            <tr><td>3</td><td>Kaleb T.</td><td>115</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- View 4: Fixtures -->
    <section id="tab-fixtures" class="tab-content">
      <div class="fixture-list">
        <h3>Gameweek 1</h3>
        <div class="fixture-item">
          <span>St. George</span>
          <span class="vs">VS</span>
          <span>Ethiopia Bunna</span>
        </div>
        <div class="fixture-item">
          <span>Fasil Kenema</span>
          <span class="vs">VS</span>
          <span>Bahir Dar</span>
        </div>
        <div class="fixture-item">
          <span>Adama City</span>
          <span class="vs">VS</span>
          <span>Ethiopia Insurance</span>
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
