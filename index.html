<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethio Premier Fantasy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <h1>ETHIO PREMIER FANTASY</h1>
            <span class="manager-name">Manager: Nate</span>
        </div>
        <div class="stats-bar">
            <div class="stat-box">
                <span>GW</span>
                <strong>GW 1</strong>
            </div>
            <div class="stat-box">
                <span>Budget</span>
                <strong>£100.0m</strong>
            </div>
            <div class="stat-box">
                <span>Points</span>
                <strong>0</strong>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="pitch-container">
            <div class="fpl-pitch">
                
                <!-- GOALKEEPER ROW -->
                <div class="pitch-row">
                    <div class="player-slot empty" onclick="openMarket('GKP')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">GKP</span>
                    </div>
                </div>

                <!-- DEFENDERS ROW -->
                <div class="pitch-row">
                    <div class="player-slot empty" onclick="openMarket('DEF')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">DEF</span>
                    </div>
                    <div class="player-slot empty" onclick="openMarket('DEF')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">DEF</span>
                    </div>
                    <div class="player-slot empty" onclick="openMarket('DEF')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">DEF</span>
                    </div>
                    <div class="player-slot empty" onclick="openMarket('DEF')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">DEF</span>
                    </div>
                </div>

                <!-- MIDFIELDERS ROW -->
                <div class="pitch-row">
                    <div class="player-slot empty" onclick="openMarket('MID')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">MID</span>
                    </div>
                    <div class="player-slot empty" onclick="openMarket('MID')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">MID</span>
                    </div>
                    <div class="player-slot empty" onclick="openMarket('MID')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">MID</span>
                    </div>
                    <div class="player-slot empty" onclick="openMarket('MID')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">MID</span>
                    </div>
                </div>

                <!-- FORWARDS ROW -->
                <div class="pitch-row">
                    <div class="player-slot empty" onclick="openMarket('FWD')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">FWD</span>
                    </div>
                    <div class="player-slot empty" onclick="openMarket('FWD')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">FWD</span>
                    </div>
                </div>

            </div>

            <!-- BENCH PANEL -->
            <div class="bench-container">
                <h3>Substitutes Bench</h3>
                <div class="bench-row">
                    <div class="player-slot empty bench-slot" onclick="openMarket('GKP')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">GKP</span>
                    </div>
                    <div class="player-slot empty bench-slot" onclick="openMarket('DEF')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">SUB 1</span>
                    </div>
                    <div class="player-slot empty bench-slot" onclick="openMarket('MID')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">SUB 2</span>
                    </div>
                    <div class="player-slot empty bench-slot" onclick="openMarket('FWD')">
                        <div class="plus-badge">+</div>
                        <span class="slot-title">SUB 3</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function openMarket(position) {
            alert(`Opening transfer market filter for: ${position}`);
        }
    </script>
</body>
</html>
