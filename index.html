<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPL Fantasy Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white flex flex-col h-screen overflow-hidden select-none">

  <!-- Header Section -->
  <header class="bg-[#1e293b] p-3 border-b border-gray-800 flex justify-between items-center shadow-md">
    <div>
      <h1 class="font-black text-sm text-white tracking-wide">Gulit FC</h1>
      <p class="text-[10px] text-gray-400">Gameweek <span id="gw-number">1</span> • Live Engine</p>
    </div>
    <div class="text-center bg-[#0f172a] px-3 py-1 rounded-lg border border-gray-700">
      <div class="text-[9px] text-gray-400 uppercase font-bold">Total Points</div>
      <div id="total-points" class="text-sm font-black text-green-400">0</div>
    </div>
    <button onclick="resetSquadData()" class="bg-red-600/80 hover:bg-red-600 text-white text-[10px] font-bold px-2.5 py-1 rounded shadow">Reset</button>
  </header>

  <!-- Sub Header Stats -->
  <div class="bg-[#17212b] px-3 py-1.5 border-b border-gray-800 flex justify-between items-center text-[11px]">
    <div>Bank: <span id="bank-balance" class="font-bold text-green-400">1.0M</span></div>
    <div>Squad: <span id="squad-count" class="font-bold text-blue-400">15/15</span></div>
    <div>Free Trans: <span id="free-trans" class="font-bold text-yellow-400">1</span></div>
  </div>

  <!-- Chips Bar Panel -->
  <div class="bg-[#1e293b] px-2 py-1.5 flex gap-1 border-b border-gray-800">
    <button id="btn-chip-wc" class="flex-1 py-1 bg-[#242f3d] border border-gray-700 text-gray-300 rounded text-[10px] font-bold">Wildcard</button>
    <button id="btn-chip-tc" class="flex-1 py-1 bg-[#242f3d] border border-gray-700 text-gray-300 rounded text-[10px] font-bold">3x Captain</button>
    <button id="btn-chip-bb" class="flex-1 py-1 bg-[#242f3d] border border-gray-700 text-gray-300 rounded text-[10px] font-bold">Bench Boost</button>
    <button id="btn-chip-fh" class="flex-1 py-1 bg-[#242f3d] border border-gray-700 text-gray-300 rounded text-[10px] font-bold">Free Hit</button>
  </div>

  <!-- Gameweek Simulation Button -->
  <div class="px-2 py-1 bg-[#0f172a]">
    <button onclick="simulateGameweek()" class="w-full bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-black py-2 rounded-lg text-xs shadow-lg uppercase tracking-wider flex items-center justify-center gap-1">
      ⚡ Simulate Gameweek Matches
    </button>
  </div>

  <!-- Main Content Tabs Area -->
  <main class="flex-1 overflow-hidden relative">
    
    <!-- Tab 1: Pick Team (Pitch) -->
    <div id="tab-pitch" class="absolute inset-0 p-2 overflow-y-auto flex flex-col">
      <div id="pitch-container" class="flex-1 flex flex-col justify-between"></div>
    </div>

    <!-- Tab 2: Transfers Market -->
    <div id="tab-transfers" class="absolute inset-0 p-3 overflow-y-auto hidden">
      <div class="text-xs font-bold text-blue-400 mb-2">Player Market & Transfers</div>
      <div id="market-list" class="space-y-2"></div>
    </div>

    <!-- Tab 3: Leagues -->
    <div id="tab-league" class="absolute inset-0 p-3 overflow-y-auto hidden">
      <div class="text-xs font-bold text-blue-400 mb-2">My Leagues & Standings</div>
      <div class="flex gap-2 mb-3">
        <button onclick="createLeague()" class="flex-1 py-1.5 bg-blue-600 rounded text-xs font-bold text-white">Create League</button>
        <button onclick="joinLeague()" class="flex-1 py-1.5 bg-gray-700 rounded text-xs font-bold text-gray-200">Join League</button>
      </div>
      <input type="text" id="league-code-input" placeholder="Enter League Code..." class="w-full bg-[#242f3d] border border-gray-700 rounded p-1.5 text-xs text-white mb-3 px-2">
      <div id="league-list" class="space-y-2"></div>
    </div>

    <!-- Tab 4: Points Column -->
    <div id="tab-points" class="absolute inset-0 p-3 overflow-y-auto hidden">
      <div class="text-xs font-bold text-blue-400 mb-2">Gameweek Points Breakdown</div>
      <div id="points-list"></div>
    </div>

  </main>

  <!-- Four Column Bottom Navigation Footer -->
  <nav class="bg-[#1e293b] border-t border-gray-800 flex justify-around py-1.5 px-1 shadow-lg">
    <button id="btn-pitch" class="flex-1 py-1 text-blue-400 font-bold text-[10px] text-center border-b-2 border-blue-400">Pick Team</button>
    <button id="btn-transfers" class="flex-1 py-1 text-gray-400 font-bold text-[10px] text-center">Transfers</button>
    <button id="btn-league" class="flex-1 py-1 text-gray-400 font-bold text-[10px] text-center">Leagues</button>
    <button id="btn-points" class="flex-1 py-1 text-gray-400 font-bold text-[10px] text-center">Points</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
