<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ethiopian FPL</title>
  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fpl: {
              purple: '#37003c',
              green: '#00ff85',
              dark: '#1f1f2e',
              gray: '#eaeaea'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .fpl-pitch {
      background: repeating-linear-gradient(
        0deg,
        #4ade80,
        #4ade80 40px,
        #22c55e 40px,
        #22c55e 80px
      );
      border: 4px solid #ffffff;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 pb-24 font-sans select-none">

  <!-- Header -->
  <header class="bg-fpl-purple text-white p-4 shadow-md sticky top-0 z-40">
    <div class="flex justify-between items-center mb-2">
      <h1 class="text-xl font-black tracking-tight">ETHIOPIAN <span class="text-fpl-green">FPL</span></h1>
      <button onclick="simulateGameweek()" class="bg-fpl-green text-fpl-purple px-3 py-1 text-xs font-bold rounded-full shadow hover:bg-white transition">Simulate GW</button>
    </div>
    
    <!-- Stats Bar -->
    <div class="flex justify-between items-center bg-white/10 rounded-lg p-2 text-xs font-bold">
      <div class="text-center w-1/4 border-r border-white/20">
        <div class="text-gray-300 font-normal">GW</div>
        <div id="gw-number" class="text-lg">1</div>
      </div>
      <div class="text-center w-1/4 border-r border-white/20">
        <div class="text-gray-300 font-normal">Points</div>
        <div id="total-points" class="text-lg">0</div>
      </div>
      <div class="text-center w-1/4 border-r border-white/20">
        <div class="text-gray-300 font-normal">Bank</div>
        <div id="bank-balance" class="text-lg">1.0</div>
      </div>
      <div class="text-center w-1/4">
        <div class="text-gray-300 font-normal">Squad</div>
        <div id="squad-count" class="text-lg">15/15</div>
      </div>
    </div>
  </header>

  <!-- Main Content Areas -->
  <main class="p-3">
    <!-- Pick Team Tab -->
    <div id="tab-pitch" class="block">
      <div id="pitch-container"></div>
    </div>

    <!-- Transfers Tab -->
    <div id="tab-transfers" class="hidden"></div>

    <!-- Leagues Tab -->
    <div id="tab-leagues" class="hidden"></div>

    <!-- Points Tab -->
    <div id="tab-points" class="hidden"></div>
  </main>

  <!-- Bottom Navigation with Safe Area Padding -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center text-[10px] font-bold text-gray-500 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-40 pb-[calc(0.75rem+env(safe-area-inset-bottom))] pt-2">
    <button onclick="switchTab('pitch')" id="nav-pitch" class="flex-1 py-2 flex flex-col items-center text-fpl-purple border-t-2 border-fpl-purple">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      Pick Team
    </button>
    <button onclick="switchTab('transfers')" id="nav-transfers" class="flex-1 py-2 flex flex-col items-center border-t-2 border-transparent">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
      Transfers
    </button>
    <button onclick="switchTab('leagues')" id="nav-leagues" class="flex-1 py-2 flex flex-col items-center border-t-2 border-transparent">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"></path></svg>
      Leagues
    </button>
    <button onclick="switchTab('points')" id="nav-points" class="flex-1 py-2 flex flex-col items-center border-t-2 border-transparent">
      <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      Points
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
