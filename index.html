<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EFPL Fantasy Gateway</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Status Bar -->
  <header class="app-header">
    <div class="user-profile">
      <span class="avatar">⚽</span>
      <div class="user-meta">
        <h3 id="manager-name">Manager</h3>
        <p id="team-name">EFPL Fantasy Club</p>
      </div>
    </div>
    <div class="stats-banner">
      <div class="stat-box">
        <span class="stat-label">Squad</span>
        <span class="stat-value" id="squad-count">0/15</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Bank</span>
        <span class="stat-value" id="bank-val">ETB 100.0M</span>
      </div>
    </div>
  </header>

  <!-- Starting XI Pitch Area -->
  <main class="content-container">
    <div class="pitch-container">
      <div class="pitch-row" id="row-GKP"></div>
      <div class="pitch-row" id="row-DEF"></div>
      <div class="pitch-row" id="row-MID"></div>
      <div class="pitch-row" id="row-FWD"></div>
    </div>

    <!-- Bench Area (4 Substitutes) -->
    <div class="bench-container">
      <h4>Substitutes</h4>
      <div class="bench-row" id="row-BENCH"></div>
    </div>
  </main>

  <!-- Player Selection Modal -->
  <div class="modal-overlay" id="selection-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Select Player</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="market-controls">
        <input type="text" id="modal-search" placeholder="Search player name..." oninput="filterModalPlayers()">
      </div>
      <div id="player-options-list" class="modal-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
