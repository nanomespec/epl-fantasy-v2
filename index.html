<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethio Fantasy | Play to Win</title>
    <script src="[https://telegram.org/js/telegram-web-app.js](https://telegram.org/js/telegram-web-app.js)"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Ethio Fantasy</h1>
        <div class="user-status">Manager: <span id="manager-name">Nate</span></div>
    </header>

    <nav class="tabs">
        <button class="tab active" data-target="pitch">Pitch</button>
        <button class="tab" data-target="transfers">Transfers</button>
        <button class="tab" data-target="leagues">Mini-Leagues</button>
    </nav>

    <main class="content">
        <section id="pitch" class="view active">
            <div class="pitch-container">
                <div class="pitch-row gkp" id="pos-gkp"></div>
                <div class="pitch-row def" id="pos-def"></div>
                <div class="pitch-row mid" id="pos-mid"></div>
                <div class="pitch-row fwd" id="pos-fwd"></div>
            </div>
        </section>

        <section id="transfers" class="view hidden">
            <h2>Player Market</h2>
            <div id="market-list"></div>
        </section>

        <section id="leagues" class="view hidden">
            <h2>Global & Private Leagues</h2>
            <div id="league-standings"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
